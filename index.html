<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de Español</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .nav-btn {
            background: white;
            border: none;
            padding: 20px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .nav-btn.active {
            background: #667eea;
            color: white;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-height: 300px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .question {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .verb-info {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #666;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .options {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 15px;
            font-size: 1.05em;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .feedback {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 600;
            text-align: center;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .score {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
            color: #666;
        }

        .flashcard {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
            margin-bottom: 20px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-content {
            text-align: center;
            padding: 30px;
            backface-visibility: hidden;
        }

        .flashcard-front {
            font-size: 2em;
            font-weight: 600;
        }

        .flashcard-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotateY(180deg);
            backface-visibility: hidden;
        }

        .hint {
            font-size: 0.9em;
            color: #888;
            font-style: italic;
            margin-top: 10px;
        }

        .sentence {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .blank {
            display: inline-block;
            min-width: 120px;
            border-bottom: 2px solid #667eea;
            text-align: center;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5em;
            }
            
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Práctica de Español</h1>
            <p>Mejora tu español practicando cada día</p>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showSection('conjugaciones')">
                Conjugaciones
            </button>
            <button class="nav-btn" onclick="showSection('frases')">
                Completar Frases
            </button>
            <button class="nav-btn" onclick="showSection('flashcards')">
                Flashcards
            </button>
        </div>

        <div class="card">
            <!-- Sección de Conjugaciones -->
            <div id="conjugaciones" class="section active">
                <h2 style="margin-bottom: 20px; color: #667eea;">Practica Conjugaciones</h2>
                <div class="question" id="conj-question"></div>
                <div class="verb-info" id="verb-info"></div>
                <input type="text" id="conj-answer" placeholder="Escribe la conjugación...">
                <button class="btn-primary" onclick="checkConjugation()">Verificar</button>
                <div id="conj-feedback"></div>
                <div class="score" id="conj-score">Correctas: 0 | Intentos: 0</div>
            </div>

            <!-- Sección de Completar Frases -->
            <div id="frases" class="section">
                <h2 style="margin-bottom: 20px; color: #667eea;">Completar Frases</h2>
                <div class="sentence" id="sentence"></div>
                <div class="options" id="options"></div>
                <button class="btn-primary" onclick="checkSentence()" id="check-sentence-btn">Verificar</button>
                <div id="sentence-feedback"></div>
                <div class="score" id="sentence-score">Correctas: 0 | Intentos: 0</div>
            </div>

            <!-- Sección de Flashcards -->
            <div id="flashcards" class="section">
                <h2 style="margin-bottom: 20px; color: #667eea;">Flashcards de Vocabulario</h2>
                <p style="margin-bottom: 15px; color: #666;">Haz clic en la tarjeta para ver la traducción</p>
                <div class="flashcard" id="flashcard" onclick="flipCard()">
                    <div class="flashcard-content flashcard-front" id="card-front"></div>
                    <div class="flashcard-content flashcard-back" id="card-back"></div>
                </div>
                <button class="btn-primary" onclick="nextFlashcard()">Siguiente Tarjeta</button>
                <div class="score" id="flashcard-progress"></div>
            </div>
        </div>
    </div>

    <script>
        // Datos de práctica
        const irregularVerbs = [
            { verb: 'ser', infinitive: 'ser', person: 'yo', tense: 'pretérito', answer: 'fui' },
            { verb: 'ir', infinitive: 'ir', person: 'ellos', tense: 'imperfecto', answer: 'iban' },
            { verb: 'hacer', infinitive: 'hacer', person: 'tú', tense: 'pretérito', answer: 'hiciste' },
            { verb: 'tener', infinitive: 'tener', person: 'ella', tense: 'pretérito', answer: 'tuvo' },
            { verb: 'estar', infinitive: 'estar', person: 'nosotros', tense: 'imperfecto', answer: 'estábamos' },
            { verb: 'poder', infinitive: 'poder', person: 'yo', tense: 'pretérito', answer: 'pude' },
            { verb: 'poner', infinitive: 'poner', person: 'ustedes', tense: 'pretérito', answer: 'pusieron' },
            { verb: 'saber', infinitive: 'saber', person: 'él', tense: 'pretérito', answer: 'supo' },
            { verb: 'decir', infinitive: 'decir', person: 'yo', tense: 'pretérito', answer: 'dije' },
            { verb: 'venir', infinitive: 'venir', person: 'tú', tense: 'imperfecto', answer: 'venías' },
        ];

        const sentences = [
            {
                text: 'Cuando yo ___ niño, siempre ___ al parque.',
                options: ['era/iba', 'fui/fui', 'era/fui', 'fui/iba'],
                correct: 0,
                explanation: 'Usamos imperfecto para describir acciones habituales en el pasado.'
            },
            {
                text: 'Es importante que tú ___ la tarea antes de salir.',
                options: ['haces', 'hagas', 'hiciste', 'harás'],
                correct: 1,
                explanation: 'Después de "es importante que" usamos subjuntivo.'
            },
            {
                text: 'Ayer ___ al cine y ___ una película excelente.',
                options: ['iba/veía', 'fui/vi', 'iba/vi', 'fui/veía'],
                correct: 1,
                explanation: 'Usamos pretérito para acciones completadas en el pasado.'
            },
            {
                text: 'Ojalá que ___ buen tiempo mañana.',
                options: ['hace', 'haga', 'hizo', 'hacía'],
                correct: 1,
                explanation: 'Después de "ojalá que" usamos subjuntivo.'
            },
            {
                text: 'Cuando ___ joven, ___ mucho deporte.',
                options: ['era/practicaba', 'fui/practiqué', 'era/practiqué', 'fui/practicaba'],
                correct: 0,
                explanation: 'Imperfecto para descripciones y acciones habituales en el pasado.'
            }
        ];

        const flashcards = [
            { spanish: 'el cuchillo', english: 'the knife' },
            { spanish: 'la cuchara', english: 'the spoon' },
            { spanish: 'el tenedor', english: 'the fork' },
            { spanish: 'la taza', english: 'the cup' },
            { spanish: 'el plato', english: 'the plate' },
            { spanish: 'la servilleta', english: 'the napkin' },
            { spanish: 'el vaso', english: 'the glass' },
            { spanish: 'la olla', english: 'the pot' },
            { spanish: 'la sartén', english: 'the pan' },
            { spanish: 'el horno', english: 'the oven' }
        ];

        // Estado del juego
        let currentVerb = null;
        let currentSentence = null;
        let currentFlashcard = 0;
        let selectedOption = null;
        let scores = {
            conjugaciones: { correct: 0, attempts: 0 },
            frases: { correct: 0, attempts: 0 }
        };

        // Funciones de navegación
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(section).classList.add('active');
            event.target.classList.add('active');

            if (section === 'conjugaciones') loadNewVerb();
            if (section === 'frases') loadNewSentence();
            if (section === 'flashcards') loadFlashcard();
        }

        // Conjugaciones
        function loadNewVerb() {
            currentVerb = irregularVerbs[Math.floor(Math.random() * irregularVerbs.length)];
            document.getElementById('conj-question').textContent = 
                `¿Cómo se conjuga "${currentVerb.infinitive}" en ${currentVerb.tense}?`;
            document.getElementById('verb-info').textContent = 
                `Persona: ${currentVerb.person}`;
            document.getElementById('conj-answer').value = '';
            document.getElementById('conj-feedback').innerHTML = '';
        }

        function checkConjugation() {
            const answer = document.getElementById('conj-answer').value.trim().toLowerCase();
            const feedback = document.getElementById('conj-feedback');
            
            scores.conjugaciones.attempts++;

            if (answer === currentVerb.answer.toLowerCase()) {
                scores.conjugaciones.correct++;
                feedback.className = 'feedback correct';
                feedback.textContent = '¡Correcto! 🎉';
                setTimeout(() => {
                    loadNewVerb();
                }, 1500);
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `Incorrecto. La respuesta correcta es: <strong>${currentVerb.answer}</strong>`;
            }

            updateScore('conjugaciones');
        }

        // Completar Frases
        function loadNewSentence() {
            currentSentence = sentences[Math.floor(Math.random() * sentences.length)];
            document.getElementById('sentence').textContent = currentSentence.text;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            selectedOption = null;

            currentSentence.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectOption(index);
                optionsDiv.appendChild(btn);
            });

            document.getElementById('sentence-feedback').innerHTML = '';
        }

        function selectOption(index) {
            selectedOption = index;
            document.querySelectorAll('.option-btn').forEach((btn, i) => {
                btn.classList.toggle('selected', i === index);
            });
        }

        function checkSentence() {
            if (selectedOption === null) {
                alert('Por favor selecciona una opción');
                return;
            }

            const feedback = document.getElementById('sentence-feedback');
            scores.frases.attempts++;

            if (selectedOption === currentSentence.correct) {
                scores.frases.correct++;
                feedback.className = 'feedback correct';
                feedback.innerHTML = `¡Correcto! 🎉<br><span style="font-weight: normal; font-size: 0.9em;">${currentSentence.explanation}</span>`;
                setTimeout(() => {
                    loadNewSentence();
                }, 2500);
            } else {
                feedback.className = 'feedback incorrect';
                feedback.innerHTML = `Incorrecto. La respuesta correcta es: <strong>${currentSentence.options[currentSentence.correct]}</strong><br><span style="font-weight: normal; font-size: 0.9em;">${currentSentence.explanation}</span>`;
            }

            updateScore('frases');
        }

        // Flashcards
        function loadFlashcard() {
            const card = flashcards[currentFlashcard];
            document.getElementById('card-front').textContent = card.spanish;
            document.getElementById('card-back').textContent = card.english;
            document.getElementById('flashcard').classList.remove('flipped');
            updateFlashcardProgress();
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextFlashcard() {
            currentFlashcard = (currentFlashcard + 1) % flashcards.length;
            loadFlashcard();
        }

        function updateFlashcardProgress() {
            document.getElementById('flashcard-progress').textContent = 
                `Tarjeta ${currentFlashcard + 1} de ${flashcards.length}`;
        }

        // Actualizar puntuaciones
        function updateScore(section) {
            const score = scores[section];
            let elementId = section === 'conjugaciones' ? 'conj-score' : 'sentence-score';
            document.getElementById(elementId).textContent = 
                `Correctas: ${score.correct} | Intentos: ${score.attempts}`;
        }

        // Inicializar
        loadNewVerb();

        // Permitir Enter para verificar
        document.getElementById('conj-answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkConjugation();
        });
    </script>
</body>
</html>
